<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Food Score</title>
<meta name="description" content="Scan food: health score 0-100, eczema check, ingredient ratings">
<meta name="theme-color" content="#1e9e4a">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Food Score">
<link rel="stylesheet" href="css/app.css">
<script src="version.js"></script>
<script>
// Self-repair (plain old JavaScript on purpose, so even an old phone runs it): if the app does not start
// within 10 s, or one of its files fails to load, throw away the offline copy (caches + service worker)
// and reload fresh. Scans, allergies and profile live in localStorage and are NOT touched. Once per session.
(function () {
  var booted = false, KEY = 'fs-self-repair';
  window.__appBooted = function () { booted = true; try { sessionStorage.removeItem(KEY); } catch (e) {} };
  function repair(why) {
    if (booted) return;
    try { if (sessionStorage.getItem(KEY)) return; sessionStorage.setItem(KEY, why || '1'); } catch (e) { return; }
    var jobs = [];
    if (window.caches) jobs.push(caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); }));
    if (navigator.serviceWorker) jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); }));
    // also refresh the browser's own short-lived copies, so the reload cannot pick up a mixed set again
    if (window.fetch) ['./', './index.html', './version.js', './sw.js', './css/app.css', './js/app.js', './js/engine.js', './js/i18n.js',
      './js/diet.js', './js/tracker.js', './js/config.js', './js/prices.js'].forEach(function (u) { jobs.push(fetch(u, { cache: 'reload' }).catch(function () {})); });
    Promise.all(jobs).then(go, go);
    function go() { location.reload(); }
  }
  window.addEventListener('error', function (e) {
    var t = e && e.target;
    if ((t && t.tagName === 'SCRIPT') || (e && e.error && e.error.name === 'SyntaxError')) repair('load-error');
  }, true);
  setTimeout(function () { repair('timeout'); }, 10000);
})();
</script>
</head>
<body>
<header class="top">
  <h1 id="appTitle">Food Score</h1>
  <div class="top-right">
  <button id="algBadge" type="button" class="hdr-badge" hidden></button>
  <button id="settingsBtn" type="button" class="hdr-gear">⚙</button>
  <div class="lang-toggle" role="group" aria-label="Ngôn ngữ / Language">
    <button type="button" class="lang-opt" data-lang="vi" lang="vi"><span class="lang-long">🇻🇳 Tiếng Việt</span><span class="lang-short">VI</span></button><button type="button" class="lang-opt" data-lang="en" lang="en"><span class="lang-long">🇺🇸 English</span><span class="lang-short">EN</span></button>
  </div>
  </div>
</header>

<div id="updateBar" class="update-bar" hidden><button id="updateBtn" type="button"></button></div>

<main id="home" class="view">
  <button id="scanBtn" class="big primary scan-main" type="button"><span class="ico">▦</span><span class="scan-main-txt"><span data-t="scan"></span><small data-t="scanSub"></small></span></button>
  <!-- existing photos only: NO capture attribute (on Android "capture" opens the phone's own camera app and the photo never comes back) -->
  <label class="gallery-link" id="galleryLabel"><span>🖼</span> <span data-t="gallery"></span>
    <input id="photoInput" type="file" accept="image/*" hidden>
  </label>
  <button id="todayBar" type="button" class="today-bar"></button>
  <form id="typeForm" class="type-form" autocomplete="off">
    <input id="codeInput" inputmode="numeric" pattern="[0-9 ]*" maxlength="16" data-ph="typePh">
    <button type="submit" class="go" data-t="go"></button>
  </form>
  <div id="installBox" class="install" hidden>
    <button id="installBtn" type="button" class="install-btn" data-t="install" hidden></button>
    <p id="iosTip" class="tip" hidden></p>
  </div>
  <section class="history">
    <div class="history-head"><h2 data-t="history"></h2><button id="clearHist" type="button" class="link" data-t="clear"></button></div>
    <ul id="histList"></ul>
    <button id="rankBtn" type="button" class="big secondary rank-btn" hidden><span class="ico">📊</span><span data-t="myProducts"></span></button>
  </section>
</main>

<main id="result" class="view" hidden></main>
<main id="ranking" class="view" hidden></main>
<main id="allergies" class="view" hidden></main>
<main id="settings" class="view" hidden></main>
<main id="profile" class="view" hidden></main>
<main id="today" class="view" hidden></main>
<main id="weight" class="view" hidden></main>
<main id="plan" class="view" hidden></main>

<div id="busy" class="busy" hidden><div class="spinner"></div><p id="busyText"></p><p id="busyStep" class="busy-step"></p></div>

<div id="scanner" class="scanner" hidden>
  <video id="video" playsinline muted autoplay></video>
  <div class="scan-top">
    <button id="scanBack" type="button" class="scan-back" data-t="camBack"></button>
    <div class="lang-toggle" role="group" aria-label="Ngôn ngữ / Language">
      <button type="button" class="lang-opt" data-lang="vi" lang="vi"><span class="lang-long">🇻🇳 Tiếng Việt</span><span class="lang-short">VI</span></button><button type="button" class="lang-opt" data-lang="en" lang="en"><span class="lang-long">🇺🇸 English</span><span class="lang-short">EN</span></button>
    </div>
  </div>
  <div class="frame"><div class="laser"></div></div>
  <p class="scan-hint bc-only" data-t="scanHint"></p>
  <p class="scan-hint photo-only" data-t="scanHintPhoto"></p>
  <div class="scan-bottom">
    <p id="noBarcodeHint" class="nobc-hint" data-t="noBarcodeHint"></p>
    <button id="snapBtn" type="button" class="snap-btn"><span>📷</span> <span data-t="snapBtn"></span></button>
    <div class="scan-bar">
      <button id="torchBtn" type="button" class="round" hidden aria-label="torch">🔦</button>
      <label class="round gallery-round" aria-label="gallery">🖼<input id="scanGallery" type="file" accept="image/*" hidden></label>
      <button id="closeScan" type="button" class="round" aria-label="close">✕</button>
    </div>
  </div>
  <p id="scanEngine" class="scan-engine"></p>
  <div id="snapPreview" class="snap-preview" hidden>
    <img id="snapImg" alt="">
    <p id="snapInfo" class="snap-info"></p>
    <div class="snap-actions">
      <button id="snapRetake" type="button" class="snap-retake" data-t="snapRetake"></button>
      <button id="snapUse" type="button" class="snap-use" data-t="snapUse"></button>
    </div>
  </div>
</div>

<button id="scanNext" class="scan-next" type="button" hidden></button>

<footer class="foot"><span id="buildStamp"></span> · <span data-t="dataCredit"></span></footer>
<script type="module" src="js/app.js"></script>
</body>
</html>
